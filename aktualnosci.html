<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aktualności | KPN</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #0b0b0b;
            color: #f0f0f0;
            line-height: 1.6;
            padding-bottom: 60px;
        }

        /* Nowoczesny header / nawigacja stylizowana na stronę główną (glassmorphism / minimalistyczny dark) */
        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(11, 11, 11, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .nav-container {
            max-width: 1300px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
            text-decoration: none;
            font-weight: 800;
            font-size: 1.2rem;
            letter-spacing: 1px;
        }

        .nav-logo span {
            color: #e61c1c;
        }

        .nav-menu {
            display: flex;
            gap: 30px;
            list-style: none;
            align-items: center;
        }

        .nav-menu a {
            color: #999;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.8px;
            transition: color 0.2s ease;
            text-transform: uppercase;
        }

        .nav-menu a:hover, 
        .nav-menu a.active {
            color: #fff;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-lang-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #ccc;
            padding: 6px 12px;
            border-radius: 6px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-lang-btn:hover {
            border-color: rgba(255, 255, 255, 0.3);
            color: #fff;
        }

        .nav-cta {
            background: #e61c1c;
            color: #fff;
            padding: 10px 22px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background 0.2s, transform 0.2s;
            box-shadow: 0 4px 15px rgba(230, 28, 28, 0.3);
        }

        .nav-cta:hover {
            background: #c81414;
            transform: translateY(-1px);
        }

        /* Hamburger menu dla urządzeń mobilnych */
        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            background: none;
            border: none;
        }

        .hamburger span {
            width: 25px;
            height: 2px;
            background: #fff;
            transition: 0.3s;
        }

        /* Sekcja nagłówka aktualności */
        .news-hero-section {
            text-align: center;
            padding: 80px 20px 50px;
        }

        .news-hero-section h1 {
            font-size: 3rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .news-hero-section h1 span {
            color: #e61c1c;
        }

        .news-hero-section p {
            color: #888;
            font-size: 0.95rem;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Siatka artykułów */
        .news-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 25px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        .news-card {
            background: #111113;
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 12px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            transition: border-color 0.2s, transform 0.2s;
        }

        .news-card:hover {
            border-color: rgba(230, 28, 28, 0.4);
            transform: translateY(-2px);
        }

        .news-card-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .news-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .news-tag {
            background: rgba(230, 28, 28, 0.12);
            color: #ff4d4d;
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.7rem;
            border: 1px solid rgba(230, 28, 28, 0.25);
            letter-spacing: 0.5px;
        }

        .news-date {
            color: #777;
            font-size: 0.8rem;
        }

        .news-card h3 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: #fff;
            line-height: 1.35;
        }

        .news-card p {
            color: #888;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .no-news {
            grid-column: 1 / -1;
            text-align: center;
            color: #777;
            padding: 40px;
        }

        /* Modal szczegółów artykułu */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: #121214;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            width: 100%;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 25px 50px rgba(0,0,0,0.9);
        }

        .modal-header-bg {
            background: radial-gradient(circle at top left, rgba(140, 20, 20, 0.7) 0%, rgba(18, 18, 20, 0.95) 60%);
            padding: 45px 40px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
        }

        .modal-title {
            font-size: 2.2rem;
            font-weight: 900;
            text-transform: uppercase;
            color: #fff;
            line-height: 1.15;
            letter-spacing: 0.5px;
            max-width: 90%;
            margin-bottom: 15px;
        }

        .modal-meta-top {
            color: #aaa;
            font-size: 0.9rem;
        }

        .modal-meta-top a {
            color: #3b82f6;
            text-decoration: none;
        }

        .modal-close-btn {
            position: absolute;
            top: 25px;
            right: 25px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .modal-close-btn:hover {
            background: rgba(230, 28, 28, 0.8);
        }

        .modal-body-content {
            padding: 40px;
        }

        .modal-author-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
            color: #aaa;
            font-size: 0.9rem;
        }

        .modal-author-icon {
            width: 36px;
            height: 36px;
            background: #1a1a1c;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-text-block p {
            color: #d0d0d0;
            font-size: 1rem;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        /* Responsywność */
        @media (max-width: 900px) {
            .nav-menu {
                display: none;
            }
            .hamburger {
                display: flex;
            }
            .nav-container {
                padding: 15px 20px;
            }
        }

        @media (max-width: 768px) {
            .news-container {
                grid-template-columns: 1fr;
            }
            .news-hero-section h1 {
                font-size: 2.2rem;
            }
            .modal-header-bg, .modal-body-content {
                padding: 25px;
            }
            .modal-title {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>

    <!-- Nawigacja (Menu główne) -->
    <header>
        <div class="nav-container">
            <a href="#" class="nav-logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                KPN<span>.</span>
            </a>
            
            <ul class="nav-menu">
                <li><a href="#">Strona główna</a></li>
                <li><a href="#">O nas</a></li>
                <li><a href="#">Program</a></li>
                <li><a href="#" class="active">Aktualności</a></li>
                <li><a href="#">Struktury</a></li>
                <li><a href="#">Kontakt</a></li>
            </ul>

            <div class="nav-actions">
                <button class="nav-lang-btn">PL</button>
                <a href="#" class="nav-cta">Dołącz do nas</a>
                <button class="hamburger" aria-label="Menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
    </header>

    <!-- Nagłówek sekcji -->
    <section class="news-hero-section">
        <h1>Najnowsze <span>Aktualności</span></h1>
        <p>Bądź na bieżąco z ogłoszeniami, komunikatami i wydarzeniami środowiska KPN.</p>
    </section>

    <!-- Lista artykułów (z localStorage) -->
    <section class="news-container" id="publicNewsContainer">
        <!-- Dynamiczne renderowanie -->
    </section>

    <!-- Okno modalne -->
    <div class="modal-overlay" id="articleModal" onclick="closeModalOnOutside(event)">
        <div class="modal-box">
            <button class="modal-close-btn" onclick="closeModal()">×</button>
            <div class="modal-header-bg">
                <h2 class="modal-title" id="modalTitle">Tytuł artykułu</h2>
                <div class="modal-meta-top">Opublikowano w <a href="#">aktualności</a></div>
            </div>
            <div class="modal-body-content">
                <div class="modal-author-row">
                    <div class="modal-author-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                    </div>
                    <div><strong>KPN</strong> &nbsp; <span id="modalDate" style="color: #777;">25 lipiec 2026</span></div>
                </div>
                <div class="modal-text-block" id="modalContent">
                    <!-- Treść akapitów -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'kpn_articles_data';

        const defaultArticles = [
            {
                id: 1,
                date: "2026-07-25",
                time: "15:30",
                imageURL: "",
                translations: {
                    PL: {
                        title: "Rozbudowa Struktur i Nowy Program Polityczny",
                        tag: "Polityka",
                        displayDate: "25 lipiec 2026",
                        content: [
                            "Rozpoczęliśmy wdrażanie kolejnego etapu rozwoju struktur regionalnych w całym kraju.",
                            "Nasz program opiera się na absolutnej suwerenności, wolnym rynku oraz obronie interesów polskich obywateli.",
                            "Zachęcamy do zapoznania się ze szczegółami w zakładce Program oraz do aktywnego włączania się w nasze inicjatywy społeczno-polityczne."
                        ]
                    }
                }
            },
            {
                id: 2,
                date: "2026-07-20",
                time: "12:00",
                imageURL: "",
                translations: {
                    PL: {
                        title: "Witaj w Oficjalnej Społeczności KPN",
                        tag: "Ogłoszenie",
                        displayDate: "20 lipiec 2026",
                        content: [
                            "Witamy w oficjalnej społeczności Konfederacji Polski Niepodległej!",
                            "Dzięki tej platformie będziemy na bieżąco publikować najważniejsze komunikaty oraz informacje o zbliżających się wydarzeniach."
                        ]
                    }
                }
            }
        ];

        let currentArticles = [];

        function renderArticles() {
            let data = localStorage.getItem(STORAGE_KEY);
            if (!data) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultArticles));
                data = JSON.stringify(defaultArticles);
            }

            currentArticles = JSON.parse(data);
            const container = document.getElementById('publicNewsContainer');
            container.innerHTML = '';

            if (currentArticles.length === 0) {
                container.innerHTML = `<div class="no-news">Brak aktualności do wyświetlenia.</div>`;
                return;
            }

            currentArticles.forEach(article => {
                const lang = article.translations['PL'] || {};
                const displayDate = article.time ? `${article.date} ${article.time}` : article.date;
                const paragraphs = Array.isArray(lang.content) ? lang.content : [lang.content || ''];
                const snippet = paragraphs[0] + (paragraphs.length > 1 ? '...' : '');

                let imgHTML = article.imageURL 
                    ? `<img src="${article.imageURL}" class="news-card-img" alt="Grafika">` 
                    : '';

                const card = document.createElement('div');
                card.className = 'news-card';
                card.onclick = () => openModal(article.id);
                card.innerHTML = `
                    <div>
                        ${imgHTML}
                        <div class="news-card-header">
                            <span class="news-tag">${lang.tag || 'Ogłoszenie'}</span>
                            <span class="news-date">${displayDate}</span>
                        </div>
                        <h3>${lang.title || ''}</h3>
                        <p>${snippet}</p>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openModal(id) {
            const article = currentArticles.find(a => a.id === id);
            if (!article) return;

            const lang = article.translations['PL'] || {};
            document.getElementById('modalTitle').innerText = lang.title || '';
            document.getElementById('modalDate').innerText = lang.displayDate || article.date || '';

            const contentDiv = document.getElementById('modalContent');
            contentDiv.innerHTML = '';

            const paragraphs = Array.isArray(lang.content) ? lang.content : [lang.content || ''];
            paragraphs.forEach(text => {
                const p = document.createElement('p');
                p.innerText = text;
                contentDiv.appendChild(p);
            });

            document.getElementById('articleModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('articleModal').classList.remove('active');
        }

        function closeModalOnOutside(event) {
            if (event.target.id === 'articleModal') {
                closeModal();
            }
        }

        window.onload = renderArticles;

        window.addEventListener('storage', (e) => {
            if (e.key === STORAGE_KEY) {
                renderArticles();
            }
        });
    </script>
</body>
</html>
