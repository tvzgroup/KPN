<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aktualności | KPN</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #080808;
            color: #f0f0f0;
            line-height: 1.6;
            padding-bottom: 60px;
        }

        /* Nawigacja (przykładowa, dopasowana do stylu ze screena) */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background: #080808;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
            font-weight: 700;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            color: #ccc;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: color 0.3s;
        }

        .nav-links a:hover, .nav-links a.active {
            color: #fff;
        }

        .cta-nav-btn {
            background: #d91414;
            color: #fff !important;
            padding: 10px 20px;
            border-radius: 4px;
            text-transform: uppercase;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.3s;
        }

        .cta-nav-btn:hover {
            background: #b51010;
        }

        /* Sekcja nagłówka aktualności */
        .news-hero-section {
            text-align: center;
            padding: 80px 20px 60px;
        }

        .news-hero-section h1 {
            font-size: 3rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .news-hero-section h1 span {
            color: #d91414;
        }

        .news-hero-section p {
            color: #aaa;
            font-size: 1.05rem;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Siatka artykułów */
        .news-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(480px, 1fr));
            gap: 30px;
        }

        .news-card {
            background: #121215;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .news-card:hover {
            border-color: rgba(217, 20, 20, 0.4);
            transform: translateY(-3px);
        }

        .news-card-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .news-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .news-tag {
            background: rgba(217, 20, 20, 0.15);
            color: #ff4d4d;
            padding: 5px 12px;
            border-radius: 4px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            border: 1px solid rgba(217, 20, 20, 0.3);
        }

        .news-date {
            color: #777;
            font-size: 0.85rem;
        }

        .news-card h3 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: #fff;
        }

        .news-card p {
            color: #aaa;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        .no-news {
            grid-column: 1 / -1;
            text-align: center;
            color: #777;
            padding: 40px;
            font-size: 1.1rem;
        }

        @media (max-width: 768px) {
            .news-container {
                grid-template-columns: 1fr;
            }
            .news-hero-section h1 {
                font-size: 2.2rem;
            }
            nav {
                padding: 15px 20px;
            }
            .nav-links {
                display: none; /* Możesz dostosować menu mobilne według uznania */
            }
        }
    </style>
</head>
<body>

    <!-- Nawigacja -->
    <nav>
        <a href="#" class="nav-logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            KPN
        </a>
        <ul class="nav-links">
            <li><a href="#">O NAS</a></li>
            <li><a href="#">PROGRAM</a></li>
            <li><a href="#" class="active">AKTUALNOŚCI</a></li>
            <li><a href="#">KONTAKT</a></li>
        </ul>
        <a href="#" class="cta-nav-btn">DOŁĄCZ DO NAS</a>
    </nav>

    <!-- Sekcja Nagłówka -->
    <section class="news-hero-section">
        <h1>Najnowsze <span>Aktualności</span></h1>
        <p>Bądź na bieżąco z ogłoszeniami, komunikatami i wydarzeniami środowiska KPN.</p>
    </section>

    <!-- Kontener na artykuły pobierane dynamicznie -->
    <section class="news-container" id="publicNewsContainer">
        <!-- Generowane automatycznie przez JavaScript -->
    </section>

    <script>
        const STORAGE_KEY = 'kpn_articles_data';

        // Oryginalne domyślne artykuły przywrócone do stanu początkowego
        const defaultArticles = [
            {
                id: 1,
                date: "2026-07-25",
                time: "15:30",
                imageURL: "",
                translations: {
                    PL: {
                        title: "Rozbudowa Struktur i Nowy Program Polityczny",
                        tag: "Polityka",
                        displayDate: "2026-07-25 15:30",
                        content: [
                            "Rozpoczęliśmy wdrażanie kolejnego etapu rozwoju struktur regionalnych w całym kraju."
                        ]
                    }
                }
            },
            {
                id: 2,
                date: "2026-07-20",
                time: "12:00",
                imageURL: "",
                translations: {
                    PL: {
                        title: "Witaj w Oficjalnej Społeczności KPN",
                        tag: "Ogłoszenie",
                        displayDate: "2026-07-20 12:00",
                        content: [
                            "Witamy w oficjalnej społeczności Konfederacji Polski Niepodległej!..."
                        ]
                    }
                }
            }
        ];

        function loadPublicArticles() {
            let data = localStorage.getItem(STORAGE_KEY);
            
            // Jeśli brak danych w pamięci przeglądarki, załaduj domyślne i je zapisz
            if (!data) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultArticles));
                data = JSON.stringify(defaultArticles);
            }

            const articles = JSON.parse(data);
            const container = document.getElementById('publicNewsContainer');
            container.innerHTML = '';

            if (articles.length === 0) {
                container.innerHTML = `<div class="no-news">Brak aktualności do wyświetlenia.</div>`;
                return;
            }

            // Wyświetlanie artykułów (od najnowszego / po ID)
            articles.forEach(article => {
                const langData = article.translations['PL'] || {};
                const displayDate = article.time ? `${article.date} ${article.time}` : article.date;
                
                // Obsługa wielu akapitów lub pierwszej linii treści
                const contentText = Array.isArray(langData.content) 
                    ? langData.content.join(' ') 
                    : (langData.content || '');

                let imgHTML = article.imageURL 
                    ? `<img src="${article.imageURL}" class="news-card-img" alt="Zdjęcie artykułu">` 
                    : '';

                const card = document.createElement('div');
                card.className = 'news-card';
                card.innerHTML = `
                    <div>
                        ${imgHTML}
                        <div class="news-card-header">
                            <span class="news-tag">${langData.tag || 'Ogłoszenie'}</span>
                            <span class="news-date">${displayDate}</span>
                        </div>
                        <h3>${langData.title || ''}</h3>
                        <p>${contentText}</p>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Automatyczne odświeżanie po uruchomieniu strony
        window.onload = loadPublicArticles;

        // Opcjonalnie: Nasłuchiwanie zmian w localStorage, jeśli panel jest otwarty w innej karcie
        window.addEventListener('storage', (event) => {
            if (event.key === STORAGE_KEY) {
                loadPublicArticles();
            }
        });
    </script>
</body>
</html>
