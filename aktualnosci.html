<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aktualności | KPN</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #080808;
            color: #f0f0f0;
            line-height: 1.6;
            padding-bottom: 60px;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 50px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background: #080808;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #fff;
            font-weight: 700;
            text-decoration: none;
            font-size: 1.2rem;
            letter-spacing: 1px;
        }

        .nav-links {
            display: flex;
            gap: 35px;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            color: #aaa;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        .nav-links a:hover, .nav-links a.active {
            color: #fff;
        }

        .cta-nav-btn {
            background: #d91414;
            color: #fff !important;
            padding: 10px 22px;
            border-radius: 4px;
            text-transform: uppercase;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-decoration: none;
            transition: background 0.3s;
        }

        .cta-nav-btn:hover {
            background: #b51010;
        }

        .news-hero-section {
            text-align: center;
            padding: 90px 20px 60px;
        }

        .news-hero-section h1 {
            font-size: 3rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .news-hero-section h1 span {
            color: #d91414;
        }

        .news-hero-section p {
            color: #888;
            font-size: 1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .news-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
        }

        .news-card {
            background: #121215;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 35px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: border-color 0.3s ease;
            cursor: pointer;
        }

        .news-card:hover {
            border-color: rgba(217, 20, 20, 0.4);
        }

        .news-card-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 25px;
        }

        .news-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .news-tag {
            background: rgba(217, 20, 20, 0.15);
            color: #ff4d4d;
            padding: 5px 12px;
            border-radius: 4px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            border: 1px solid rgba(217, 20, 20, 0.3);
            letter-spacing: 0.5px;
        }

        .news-date {
            color: #666;
            font-size: 0.85rem;
        }

        .news-card h3 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: #fff;
            line-height: 1.3;
        }

        .news-card p {
            color: #999;
            font-size: 0.95rem;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .no-news {
            grid-column: 1 / -1;
            text-align: center;
            color: #777;
            padding: 40px;
            font-size: 1.1rem;
        }

        /* Modal pełnego artykułu */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-container {
            background: #121214;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 750px;
            max-height: 90vh;
            border-radius: 12px;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }

        .modal-close {
            position: absolute;
            top: 25px;
            right: 25px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            z-index: 10;
        }

        .modal-close:hover {
            background: rgba(217, 20, 20, 0.8);
        }

        .modal-hero {
            padding: 40px;
            background: linear-gradient(135deg, rgba(217, 20, 20, 0.25) 0%, rgba(18, 18, 20, 1) 80%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .modal-hero h2 {
            font-size: 2rem;
            font-weight: 900;
            text-transform: uppercase;
            color: #fff;
            margin-bottom: 15px;
            line-height: 1.2;
        }

        .modal-hero-sub {
            color: #888;
            font-size: 0.9rem;
        }

        .modal-hero-sub span {
            color: #3b82f6;
        }

        .modal-body {
            padding: 40px;
        }

        .modal-author-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
            color: #aaa;
            font-size: 0.9rem;
        }

        .modal-author-logo {
            width: 36px;
            height: 36px;
            background: #222;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .modal-content-text p {
            color: #ccc;
            font-size: 1rem;
            margin-bottom: 20px;
            line-height: 1.8;
        }

        @media (max-width: 900px) {
            .news-container {
                grid-template-columns: 1fr;
            }
            .news-hero-section h1 {
                font-size: 2.2rem;
            }
            nav {
                padding: 20px;
            }
            .nav-links {
                display: none;
            }
            .modal-hero, .modal-body {
                padding: 25px;
            }
        }
    </style>
</head>
<body>

    <nav>
        <a href="#" class="nav-logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            KPN
        </a>
        <ul class="nav-links">
            <li><a href="#">O NAS</a></li>
            <li><a href="#">PROGRAM</a></li>
            <li><a href="#" class="active">AKTUALNOŚCI</a></li>
            <li><a href="#">KONTAKT</a></li>
        </ul>
        <a href="#" class="cta-nav-btn">DOŁĄCZ DO NAS</a>
    </nav>

    <section class="news-hero-section">
        <h1>Najnowsze <span>Aktualności</span></h1>
        <p>Bądź na bieżąco z ogłoszeniami, komunikatami i wydarzeniami środowiska KPN.</p>
    </section>

    <section class="news-container" id="publicNewsContainer">
        <!-- Generowane dynamicznie -->
    </section>

    <!-- Modal podglądu artykułu -->
    <div class="modal-overlay" id="articleModal" onclick="closeArticleModal(event)">
        <div class="modal-container" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeArticleModalBtn()">×</button>
            <div class="modal-hero">
                <h2 id="modalTitle">Tytuł artykułu</h2>
                <div class="modal-hero-sub">Opublikowano w <span style="color: #3b82f6;">aktualności</span></div>
            </div>
            <div class="modal-body">
                <div class="modal-author-row">
                    <div class="modal-author-logo">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                    </div>
                    <div><strong>KPN</strong> &nbsp; <span id="modalDate" style="color: #666;">25 lipiec 2026</span></div>
                </div>
                <div class="modal-content-text" id="modalContent">
                    <!-- Treść akapitów -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'kpn_articles_data';

        // Oryginalne artykuły zgodne z Twoim widokiem
        const defaultArticles = [
            {
                id: 1,
                date: "2026-07-25",
                time: "15:30",
                imageURL: "",
                translations: {
                    PL: {
                        title: "Rozbudowa Struktur i Nowy Program Polityczny",
                        tag: "Polityka",
                        displayDate: "25 lipiec 2026",
                        content: [
                            "Rozpoczęliśmy wdrażanie kolejnego etapu rozwoju struktur regionalnych w całym kraju.",
                            "Nasz program opiera się na absolutnej suwerenności, wolnym rynku oraz obronie interesów polskich obywateli.",
                            "Zachęcamy do zapoznania się ze szczegółami w zakładce Program oraz do aktywnego włączania się w nasze inicjatywy społeczno-polityczne."
                        ]
                    }
                }
            },
            {
                id: 2,
                date: "2026-07-20",
                time: "12:00",
                imageURL: "",
                translations: {
                    PL: {
                        title: "Witaj w Oficjalnej Społeczności KPN",
                        tag: "Ogłoszenie",
                        displayDate: "20 lipiec 2026",
                        content: [
                            "Witamy w oficjalnej społeczności Konfederacji Polski Niepodległej!",
                            "Dzięki tej platformie będziemy na bieżąco publikować najważniejsze komunikaty oraz informacje o zbliżających się wydarzeniach."
                        ]
                    }
                }
            }
        ];

        let currentArticles = [];

        function loadPublicArticles() {
            let data = localStorage.getItem(STORAGE_KEY);
            
            if (!data) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultArticles));
                data = JSON.stringify(defaultArticles);
            }

            currentArticles = JSON.parse(data);
            const container = document.getElementById('publicNewsContainer');
            container.innerHTML = '';

            if (currentArticles.length === 0) {
                container.innerHTML = `<div class="no-news">Brak aktualności do wyświetlenia.</div>`;
                return;
            }

            currentArticles.forEach(article => {
                const langData = article.translations['PL'] || {};
                const displayDate = article.time ? `${article.date} ${article.time}` : article.date;
                
                const contentArray = Array.isArray(langData.content) ? langData.content : [langData.content || ''];
                const shortText = contentArray[0] + (contentArray.length > 1 ? '...' : '');

                let imgHTML = article.imageURL 
                    ? `<img src="${article.imageURL}" class="news-card-img" alt="Zdjęcie artykułu">` 
                    : '';

                const card = document.createElement('div');
                card.className = 'news-card';
                card.onclick = () => openArticleModal(article.id);
                card.innerHTML = `
                    <div>
                        ${imgHTML}
                        <div class="news-card-header">
                            <span class="news-tag">${langData.tag || 'Ogłoszenie'}</span>
                            <span class="news-date">${displayDate}</span>
                        </div>
                        <h3>${langData.title || ''}</h3>
                        <p>${shortText}</p>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openArticleModal(id) {
            const article = currentArticles.find(a => a.id === id);
            if (!article) return;

            const langData = article.translations['PL'] || {};
            document.getElementById('modalTitle').innerText = langData.title || '';
            document.getElementById('modalDate').innerText = article.date || '';

            const contentContainer = document.getElementById('modalContent');
            contentContainer.innerHTML = '';

            const paragraphs = Array.isArray(langData.content) ? langData.content : [langData.content || ''];
            paragraphs.forEach(pText => {
                const p = document.createElement('p');
                p.innerText = pText;
                contentContainer.appendChild(p);
            });

            document.getElementById('articleModal').classList.add('active');
        }

        function closeArticleModal(event) {
            if (event.target.id === 'articleModal') {
                closeArticleModalBtn();
            }
        }

        function closeArticleModalBtn() {
            document.getElementById('articleModal').classList.remove('active');
        }

        window.onload = loadPublicArticles;

        window.addEventListener('storage', (event) => {
            if (event.key === STORAGE_KEY) {
                loadPublicArticles();
            }
        });
    </script>
</body>
</html>
